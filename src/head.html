<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نماء — متابعة الأبناء</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d5345">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  warm, encouraging family companion — calm, never childish
   IDEA   a family's daily logbook: each child's day as a page, the parent's desk as the index
   PICTURE the child's progress ring over a grid of section tiles carrying live "remaining" badges
   COLOUR deep emerald ground for the top band, warm paper below, saffron accent, coral for late
   TYPE   Readex Pro for headings and figures, IBM Plex Sans Arabic for reading
   LAYOUT single column up to 980px, tiles 3-up (2-up on small phones), cards stacked */
:root{color-scheme:light dark;
--bg:light-dark(#f5f1e8,#0e1714);--card:light-dark(#fffdf8,#15221e);--ink:light-dark(#18231f,#e9efe9);--mut:light-dark(#5d6a64,#9db0a7);
--line:light-dark(#e4dccb,#24352f);--em:#0d5345;--em2:light-dark(#0d5345,#3fae8c);--sa:#e9a23b;--co:#d8553f;--ok:#1f8a5b;--soft:light-dark(#efe8d9,#1b2b26)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,5vw,34px)}h2{font-size:20px}h3{font-size:17px}
p{margin:.3em 0}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:22px;height:22px;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px max(4vw,12px);background:var(--em);color:#f3efe2}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;font:600 20px "Readex Pro";cursor:pointer;min-height:44px;color:inherit}
.brand .i{color:var(--sa)}
.sync{margin-inline-start:auto;font-size:13px;opacity:.9;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sa)}
.sync.ok::before{background:#7be0b0}.sync.off::before{background:var(--co)}
.who{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:6px 14px;min-height:40px;cursor:pointer;color:inherit}
.hero{background:var(--em);color:#f3efe2;padding:18px max(4vw,14px) 64px}
.hero .in{max-width:980px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hero p{color:#cfe3d9}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:20px;padding:4px 12px;font-size:14px}
.pill b{color:var(--sa);font-family:"Readex Pro"}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:700 30px "Readex Pro"}
.ring .v small{display:block;font:500 12px "IBM Plex Sans Arabic";opacity:.8}
.wrap{max-width:980px;margin:auto;padding:0 max(4vw,12px) 48px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:-44px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-height:112px;box-shadow:0 6px 18px -12px rgba(0,0,0,.35);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tile .ic .i{width:26px;height:26px}
.tile .tn{font:600 15px "Readex Pro";text-align:center}
.badge{position:absolute;top:8px;inset-inline-end:8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--co);color:#fff;font:700 14px/26px "Readex Pro";text-align:center}
.badge.zero{background:var(--ok)}
.now{margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2{margin-bottom:8px}.card h3{margin-bottom:6px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-weight:600}
.btn.pri{background:var(--em2);border-color:transparent;color:#fff}
:root:not([data-theme=light]) .btn.pri{color:light-dark(#fff,#08130f)}
.btn.acc{background:var(--sa);border-color:transparent;color:#2a1a00}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:none}
.btn.dang{color:var(--co)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sa);outline-offset:2px}
input,select,textarea{font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 4px}
.f{display:grid;gap:4px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1}
.chk{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk .i{width:20px;height:20px}
.done-t{text-decoration:line-through;color:var(--mut)}
.pts{font:600 13px "Readex Pro";color:var(--sa);white-space:nowrap}
.sh{background:var(--c);color:#fff;padding:12px max(4vw,14px) 22px}
.sh>*{max-width:980px;margin-inline:auto}
.sh .sht{display:flex;gap:14px;align-items:center;margin-top:6px}
.sh .ic.big{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.sh .ic.big .i{width:30px;height:30px}
.sh p{opacity:.9}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:inherit;cursor:pointer;min-height:40px;padding:0;font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--em2));border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 12px;border-radius:16px;background:var(--soft);font-size:14px;border:1px solid var(--line)}
button.chip{cursor:pointer;min-height:36px}
.chip.on{background:var(--em2);color:#fff;border-color:transparent}
.pr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.prc{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--bg)}
.prc .num{font-size:15px;white-space:nowrap}
.prc.ontime{background:color-mix(in srgb,var(--ok) 16%,var(--bg));border-color:var(--ok)}
.prc.late{background:color-mix(in srgb,var(--sa) 18%,var(--bg));border-color:var(--sa)}
.prc.qada,.prc.miss{background:color-mix(in srgb,var(--co) 14%,var(--bg));border-color:var(--co)}
.prc.nextp{outline:2px dashed var(--em2)}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ontime{background:var(--ok)}.dots i.late{background:var(--sa)}.dots i.qada,.dots i.miss{background:var(--co)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:8px 0;align-items:baseline}
.tl .t{font:600 15px "Readex Pro";white-space:nowrap;text-align:end;color:var(--mut)}
.tl li.cur{background:color-mix(in srgb,var(--sa) 18%,transparent);border-radius:10px}
.tl li.cur .t{color:var(--ink)}
.tl .k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--c,var(--line))}
.cups{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cup{width:30px;height:38px;border:2px solid #3b8fd9;border-radius:4px 4px 10px 10px;position:relative;overflow:hidden}
.cup.on::after{content:"";position:absolute;inset:30% 0 0;background:#3b8fd9}
.big-n{font:700 clamp(30px,7vw,44px) "Readex Pro"}
.kc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;text-align:start;width:100%;font:inherit}
.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 16px "Readex Pro";background:var(--soft)}
.rank.r1{background:var(--sa);color:#2a1a00}
.ringS{width:64px;height:64px}
.ringS .v{font-size:16px}
.tag{font-size:12px;padding:2px 10px;border-radius:12px;white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.mid{background:color-mix(in srgb,var(--sa) 22%,transparent);color:light-dark(#8a5a00,var(--sa))}
.tag.bad{background:color-mix(in srgb,var(--co) 16%,transparent);color:var(--co)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs .chip{flex:none}
.ai{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px;white-space:normal}
.ai:empty{display:none}.msgbar{display:flex;align-items:center;gap:12px;width:100%;border:0;cursor:pointer;background:var(--co);color:#fff;padding:10px max(4vw,14px);font:inherit;position:sticky;top:60px;z-index:19}.msgbar .mic{animation:pulse 1.6s infinite}.recbtn.on{background:var(--co);color:#fff;animation:pulse 1.2s infinite}.list li.apv{flex-wrap:wrap;gap:6px}.apv>.grow{flex-basis:100%}td{white-space:nowrap}
.ai ul{margin:.3em 0;padding-inline-start:1.2em}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:88%}
.msg.u{background:var(--em2);color:#fff;margin-inline-start:auto}
.msg.a{background:var(--soft)}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--co);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--co) 25%,transparent)}}
.dhikr{border-bottom:1px solid var(--line);padding:10px 0;font-size:18px;line-height:1.9}
.dhikr small{color:var(--mut);font-size:13px}
.lock{display:grid;place-items:center;text-align:center;gap:8px;padding:24px 10px}
.lock .i{width:56px;height:56px}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:end center}
.modal{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px}
@media(min-width:700px){.mback{place-items:center}.modal{border-radius:20px}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;z-index:60;font-weight:600;max-width:90vw}
.q{font:600 clamp(20px,4.5vw,26px)/1.5 "Readex Pro";margin:12px 0}
.stepbar{display:flex;gap:4px;margin:8px 0}.stepbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.stepbar i.on{background:var(--sa)}
.gbar{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.gbar .num{text-align:end}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:start}
.scroll{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:14px}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .in{grid-template-columns:minmax(0,1fr)}.ring{margin:auto}.pr{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.gbar{grid-template-columns:80px minmax(0,1fr) 40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding:80px 20px">جارٍ التحميل…</div></div>
