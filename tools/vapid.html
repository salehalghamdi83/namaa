<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مفاتيح الإشعارات — نماء</title>
<style>body{font:16px/1.7 system-ui,Tahoma,sans-serif;max-width:720px;margin:auto;padding:20px;background:#f5f1e8;color:#18231f}
button{font:inherit;padding:10px 18px;border-radius:10px;border:0;background:#0d5345;color:#fff;cursor:pointer}
textarea{width:100%;font:14px monospace;padding:8px;border-radius:8px;border:1px solid #ccc;direction:ltr}label{display:block;margin-top:14px;font-weight:600}</style></head>
<body><h1>توليد مفاتيح الإشعارات</h1>
<p>اضغط الزر مرة واحدة فقط. تُولَّد المفاتيح داخل متصفحك ولا تُرسل لأي مكان.</p>
<button id="g">توليد المفاتيح</button>
<label>1) المفتاح العام — ضعه في config.js في خانة vapidPublic، وفي أسرار Supabase باسم VAPID_PUBLIC</label><textarea id="pub" rows="3" readonly></textarea>
<label>2) المفتاح الخاص — ضعه فقط في أسرار Supabase باسم VAPID_PRIVATE (لا تضعه في أي ملف ولا ترسله لأحد)</label><textarea id="priv" rows="2" readonly></textarea>
<script>
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
document.getElementById('g').onclick=async()=>{
  const k=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const raw=await crypto.subtle.exportKey('raw',k.publicKey);
  const jwk=await crypto.subtle.exportKey('jwk',k.privateKey);
  document.getElementById('pub').value=b64u(raw);
  document.getElementById('priv').value=jwk.d;
};
</script></body></html>
