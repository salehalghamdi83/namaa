<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نماء — متابعة الأبناء</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d5345">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE  warm, encouraging family companion — calm, never childish
   IDEA   a family's daily logbook: each child's day as a page, the parent's desk as the index
   PICTURE the child's progress ring over a grid of section tiles carrying live "remaining" badges
   COLOUR deep emerald ground for the top band, warm paper below, saffron accent, coral for late
   TYPE   Readex Pro for headings and figures, IBM Plex Sans Arabic for reading
   LAYOUT single column up to 980px, tiles 3-up (2-up on small phones), cards stacked */
:root{color-scheme:light dark;
--bg:light-dark(#f5f1e8,#0e1714);--card:light-dark(#fffdf8,#15221e);--ink:light-dark(#18231f,#e9efe9);--mut:light-dark(#5d6a64,#9db0a7);
--line:light-dark(#e4dccb,#24352f);--em:#0d5345;--em2:light-dark(#0d5345,#3fae8c);--sa:#e9a23b;--co:#d8553f;--ok:#1f8a5b;--soft:light-dark(#efe8d9,#1b2b26)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;overflow-x:clip}
h1,h2,h3,.num{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,5vw,34px)}h2{font-size:20px}h3{font-size:17px}
p{margin:.3em 0}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:22px;height:22px;flex:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px max(4vw,12px);background:var(--em);color:#f3efe2}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;font:600 20px "Readex Pro";cursor:pointer;min-height:44px;color:inherit}
.brand .i{color:var(--sa)}
.sync{margin-inline-start:auto;font-size:13px;opacity:.9;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sa)}
.sync.ok::before{background:#7be0b0}.sync.off::before{background:var(--co)}
.who{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:6px 14px;min-height:40px;cursor:pointer;color:inherit}
.hero{background:var(--em);color:#f3efe2;padding:18px max(4vw,14px) 64px}
.hero .in{max-width:980px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hero p{color:#cfe3d9}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border-radius:20px;padding:4px 12px;font-size:14px}
.pill b{color:var(--sa);font-family:"Readex Pro"}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font:700 30px "Readex Pro"}
.ring .v small{display:block;font:500 12px "IBM Plex Sans Arabic";opacity:.8}
.wrap{max-width:980px;margin:auto;padding:0 max(4vw,12px) 48px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:-44px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-height:112px;box-shadow:0 6px 18px -12px rgba(0,0,0,.35);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.tile .ic .i{width:26px;height:26px}
.tile .tn{font:600 15px "Readex Pro";text-align:center}
.badge{position:absolute;top:8px;inset-inline-end:8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--co);color:#fff;font:700 14px/26px "Readex Pro";text-align:center}
.badge.zero{background:var(--ok)}
.now{margin-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2{margin-bottom:8px}.card h3{margin-bottom:6px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-weight:600}
.btn.pri{background:var(--em2);border-color:transparent;color:#fff}
:root:not([data-theme=light]) .btn.pri{color:light-dark(#fff,#08130f)}
.btn.acc{background:var(--sa);border-color:transparent;color:#2a1a00}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:none}
.btn.dang{color:var(--co)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tile:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sa);outline-offset:2px}
input,select,textarea{font-size:16px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);width:100%}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 4px}
.f{display:grid;gap:4px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1}
.chk{width:34px;height:34px;flex:none;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:#fff}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk .i{width:20px;height:20px}
.done-t{text-decoration:line-through;color:var(--mut)}
.pts{font:600 13px "Readex Pro";color:var(--sa);white-space:nowrap}
.sh{background:var(--c);color:#fff;padding:12px max(4vw,14px) 22px}
.sh>*{max-width:980px;margin-inline:auto}
.sh .sht{display:flex;gap:14px;align-items:center;margin-top:6px}
.sh .ic.big{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.sh .ic.big .i{width:30px;height:30px}
.sh p{opacity:.9}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:inherit;cursor:pointer;min-height:40px;padding:0;font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--em2));border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 12px;border-radius:16px;background:var(--soft);font-size:14px;border:1px solid var(--line)}
button.chip{cursor:pointer;min-height:36px}
.chip.on{background:var(--em2);color:#fff;border-color:transparent}
.pr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.prc{border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;background:var(--bg)}
.prc .num{font-size:15px;white-space:nowrap}
.prc.ontime{background:color-mix(in srgb,var(--ok) 16%,var(--bg));border-color:var(--ok)}
.prc.late{background:color-mix(in srgb,var(--sa) 18%,var(--bg));border-color:var(--sa)}
.prc.qada,.prc.miss{background:color-mix(in srgb,var(--co) 14%,var(--bg));border-color:var(--co)}
.prc.nextp{outline:2px dashed var(--em2)}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ontime{background:var(--ok)}.dots i.late{background:var(--sa)}.dots i.qada,.dots i.miss{background:var(--co)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;padding:8px 0;align-items:baseline}
.tl .t{font:600 15px "Readex Pro";white-space:nowrap;text-align:end;color:var(--mut)}
.tl li.cur{background:color-mix(in srgb,var(--sa) 18%,transparent);border-radius:10px}
.tl li.cur .t{color:var(--ink)}
.tl .k{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--c,var(--line))}
.cups{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cup{width:30px;height:38px;border:2px solid #3b8fd9;border-radius:4px 4px 10px 10px;position:relative;overflow:hidden}
.cup.on::after{content:"";position:absolute;inset:30% 0 0;background:#3b8fd9}
.big-n{font:700 clamp(30px,7vw,44px) "Readex Pro"}
.kc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;cursor:pointer;text-align:start;width:100%;font:inherit}
.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 16px "Readex Pro";background:var(--soft)}
.rank.r1{background:var(--sa);color:#2a1a00}
.ringS{width:64px;height:64px}
.ringS .v{font-size:16px}
.tag{font-size:12px;padding:2px 10px;border-radius:12px;white-space:nowrap}
.tag.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.mid{background:color-mix(in srgb,var(--sa) 22%,transparent);color:light-dark(#8a5a00,var(--sa))}
.tag.bad{background:color-mix(in srgb,var(--co) 16%,transparent);color:var(--co)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs .chip{flex:none}
.ai{background:var(--soft);border-radius:12px;padding:12px 14px;margin-top:10px;white-space:normal}
.ai:empty{display:none}.recbtn.on{background:var(--co);color:#fff;animation:pulse 1.2s infinite}.list li.apv{flex-wrap:wrap;gap:6px}.apv>.grow{flex-basis:100%}td{white-space:nowrap}
.ai ul{margin:.3em 0;padding-inline-start:1.2em}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:88%}
.msg.u{background:var(--em2);color:#fff;margin-inline-start:auto}
.msg.a{background:var(--soft)}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:var(--co);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--co) 25%,transparent)}}
.dhikr{border-bottom:1px solid var(--line);padding:10px 0;font-size:18px;line-height:1.9}
.dhikr small{color:var(--mut);font-size:13px}
.lock{display:grid;place-items:center;text-align:center;gap:8px;padding:24px 10px}
.lock .i{width:56px;height:56px}
.mback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:grid;place-items:end center}
.modal{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 28px}
@media(min-width:700px){.mback{place-items:center}.modal{border-radius:20px}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:24px;z-index:60;font-weight:600;max-width:90vw}
.q{font:600 clamp(20px,4.5vw,26px)/1.5 "Readex Pro";margin:12px 0}
.stepbar{display:flex;gap:4px;margin:8px 0}.stepbar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.stepbar i.on{background:var(--sa)}
.gbar{display:grid;grid-template-columns:110px minmax(0,1fr) 46px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.gbar .num{text-align:end}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:start}
.scroll{overflow-x:auto}
.empty{color:var(--mut);text-align:center;padding:14px}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero .in{grid-template-columns:minmax(0,1fr)}.ring{margin:auto}.pr{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}.gbar{grid-template-columns:80px minmax(0,1fr) 40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding:80px 20px">جارٍ التحميل…</div></div>
<script src="config.js"></script><script src="vendor/supabase.js"></script>
<script>
{
// ================= core utilities =================
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>dk(new Date());
const ymOf=s=>s.slice(0,7);
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dk(d)};
const dowOf=s=>new Date(s+'T12:00:00').getDay();
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=t=>{const p=String(t||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)};
const hhmm=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const fmtMin=m=>{m=((Math.round(m)%1440)+1440)%1440;const h=Math.floor(m/60);return ((h%12)||12)+':'+pad(m%60)+' '+(h<12?'ص':'م')};
const stamp=()=>{const d=new Date();return TODAY()+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)));return isFinite(n)?n:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hijri=d=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(d)}catch(e){return ''}};
const gdate=d=>{try{return new Intl.DateTimeFormat('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long'}).format(d)}catch(e){return dk(d)}};
function normAr(s){return String(s||'').replace(/[ً-ٰٟۖ-ۭـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-يa-z0-9\s]/gi,' ').replace(/\s+/g,' ').trim()}
function mdLite(t){const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let h='',ul=false;for(const l of lines){const m=l.match(/^\s*(?:[-•*]|\d+[.)])\s+(.*)/);if(m){if(!ul){h+='<ul>';ul=true}h+='<li>'+m[1]+'</li>'}else{if(ul){h+='</ul>';ul=false}const hd=l.match(/^#+\s*(.*)/);h+=hd?'<h3>'+hd[1]+'</h3>':(l.trim()?'<p>'+l+'</p>':'')}}if(ul)h+='</ul>';return h}

// ================= icons =================
const IC={
book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/>',
spark:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/>',
globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/>',
quran:'<path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13c-3-.5-6 0-8 1.5z"/><path d="M12 6v13"/>',
moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
coin:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',
clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
play:'<rect x="2.5" y="7" width="19" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r="1"/><circle cx="18" cy="13.5" r="1"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12"/><path d="M12 8C10 4 6.5 4.5 7.5 7c.5 1 4.5 1 4.5 1zm0 0c2-4 5.5-3.5 4.5-1-.5 1-4.5 1-4.5 1z"/>',
box:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12l2 2 4-4"/>',
leaf:'<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-4 6-6.5 10-8.5"/>',
mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
speak:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',
back:'<path d="M9 5l7 7-7 7"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
pin:'<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
gear:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14a5 5 0 0 1 5.5 5"/>',
chat:'<path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8 9h8M8 12h5"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||IC.box}</svg>`;

// ================= reference data =================
const SECTIONS=[
{k:'mentor',n:'مرشدي',c:'#2b6f8f',i:'chat'},
{k:'study',n:'دراستي',c:'#2f6fdb',i:'book'},
{k:'skills',n:'شخصيتي ومهاراتي',c:'#8a4fd6',i:'spark'},
{k:'lang',n:'لغاتي',c:'#0e8f84',i:'globe'},
{k:'quran',n:'القرآن الكريم',c:'#13795f',i:'quran'},
{k:'prayer',n:'صلاتي وأذكاري',c:'#1e7a55',i:'moon'},
{k:'money',n:'حصّالتي',c:'#b57a0c',i:'coin'},
{k:'time',n:'يومي ووقتي',c:'#cf5a35',i:'clock'},

const TYPE_C={meal:'#e9a23b',school:'#2f6fdb',study:'#2f6fdb',quran:'#0d5345',lang:'#0e8f84',skills:'#8a4fd6',fun:'#d23f73',sleep:'#5b6b8c',prayer:'#1e7a55',rest:'#9db0a7',family:'#cf5a35',routine:'#9db0a7'};
function scheduleFor(k,date=TODAY()){
 const pl=plan(k),we=isWeekend(date),st=S();
 const base=(pl.schedule&&pl.schedule[we?'weekend':'school'])||defSchedule(ageOf(k),we);
 const rows=base.map(r=>({t:r[0]==='@play'?st.playStart:r[0],l:r[1],ty:r[2]}));
 const pt=ptFor(k,date);
 for(const p of PRAYERS)rows.push({t:hhmm(pt[p.k]),l:'صلاة '+(p.k==='dhuhr'&&dowOf(date)===5?'الجمعة':p.n),ty:'prayer'});
 return rows.sort((a,b)=>toMin(a.t)-toMin(b.t));
}
function nowNext(k){const rows=scheduleFor(k),n=nowMin();let cur=null,nxt=null;for(const r of rows){if(toMin(r.t)<=n)cur=r;else{nxt=r;break}}return{cur,nxt}}

// ================= task engine =================
function todayTasks(k,date=TODAY()){
 const pl=plan(k),ks=kidS(k),L=dayLog(k,date),st=S(),dow=dowOf(date),pts=+st.pts||10,out=[];
 for(const t of pl.tasks){
  if(t.rep==='once'){const dn=ks.onceDone[t.id];if(dn&&dn.slice(0,10)!==date)continue;out.push({id:t.id,sec:t.sec,label:t.label,pts:+t.pts||pts,done:!!dn,kind:'once'})}
  else{if(t.days&&t.days.length&&!t.days.includes(dow))continue;out.push({id:t.id,sec:t.sec,label:t.label,pts:+t.pts||pts,done:!!L.done[t.id],kind:'daily'})}
 }
 for(const h of ks.homework){if(h.done&&(h.doneAt||'').slice(0,10)!==date)continue;out.push({id:'hw:'+h.id,sec:'study',label:'واجب: '+h.title,pts,done:!!h.done,kind:'hw',ref:h.id})}
 for(const s of pl.subjects)for(const l of(s.lessons||[])){const dn=ks.lessonsDone[l.id];if(dn&&dn.slice(0,10)!==date)continue;out.push({id:'ls:'+l.id,sec:'study',label:'درس '+s.name+': '+l.title,pts,done:!!dn,kind:'ls',ref:l.id})}
 for(const lg of ks.langs)out.push({id:'lang:'+lg.id,sec:'lang',label:'درس اليوم في '+lg.name,pts,done:!!L.done['lang:'+lg.id],kind:'auto'});
 if(ks.skills.length)out.push({id:'sk:day',sec:'skills',label:'تحدّي المهارة اليومي',pts,done:!!L.done['sk:day'],kind:'auto'});
 out.push({id:'mentor:checkin',sec:'mentor',label:'حديث اليوم مع مرشدك',pts,done:!!L.done['mentor:checkin'],kind:'auto'});
 for(const m of(ks.mentor?.missions||[])){if(m.status==='active'||m.status==='review'||(m.status==='done'&&(m.doneAt||'').slice(0,10)===date))out.push({id:'ms:'+m.id,sec:'mentor',label:'تحدٍّ: '+m.title,pts:m.pts,done:m.status==='done',kind:'mission',bonus:true})}
 out.push({id:'q:hifz',sec:'quran',label:'تسميع الحفظ اليومي',pts:pts*2,done:!!L.done['q:hifz'],kind:'auto'});
 out.push({id:'q:read',sec:'quran',label:'ورد القراءة اليومي',pts,done:!!L.done['q:read'],kind:'auto'});
 const pt=ptFor(k,date);
 for(const p of PRAYERS)out.push({id:'p:'+p.k,sec:'prayer',label:'صلاة '+p.n,pts,done:!!L.pr[p.k],due:pt[p.k],kind:'pr'});
 out.push({id:'a:m',sec:'prayer',label:'أذكار الصباح',pts,done:!!L.az.m,due:pt.fajr,kind:'az'});
 out.push({id:'a:e',sec:'prayer',label:'أذكار المساء',pts,done:!!L.az.e,due:pt.asr,kind:'az'});
 out.push({id:'water',sec:'time',label:`شرب الماء (${waterGoal(k)} أكواب)`,pts,done:L.water>=waterGoal(k),kind:'water'});
 return out;
}
const pctOf=ts=>{ts=ts.filter(t=>!t.bonus);return ts.length?Math.round(ts.filter(t=>t.done).length/ts.length*100):0};
const isDue=(t,date=TODAY())=>date<TODAY()||t.due==null||t.due<=nowMin();
function sumUp(k,date=TODAY()){const ts=todayTasks(k,date).filter(t=>!t.bonus),L=dayLog(k,date);L.sum={d:ts.filter(t=>t.done).length,t:ts.length};touchLog(k,date)}
function addPts(k,n){const ks=kidS(k);ks.points=Math.max(0,(ks.points||0)+n);touchKid(k)}
function setTask(k,t,on){
 const ks=kidS(k),L=dayLog(k,TODAY()),ts=stamp();
 if(t.kind==='once'){if(on)ks.onceDone[t.id]=ts;else delete ks.onceDone[t.id]}
 else if(t.kind==='hw'){const h=ks.homework.find(x=>x.id===t.ref);if(!h)return;h.done=on;h.doneAt=on?ts:null}
 else if(t.kind==='ls'){if(on)ks.lessonsDone[t.ref]=ts;else delete ks.lessonsDone[t.ref]}
 else if(t.kind==='daily'||t.kind==='auto'){if(on)L.done[t.id]=ts;else delete L.done[t.id]}
 else return;
 if(on)verAuto(k,t.id);else{const L2=dayLog(k,TODAY());if(L2.ver)delete L2.ver[t.id]}
 addPts(k,on?t.pts:-t.pts);sumUp(k);if(on)toast(`أحسنت! +${t.pts} نقطة`);
}
function markAuto(k,id,pts){const L=dayLog(k,TODAY());if(L.done[id])return;L.done[id]=stamp();verAuto(k,id);addPts(k,pts||(+S().pts||10));sumUp(k)}
function weekPct(k,end=TODAY()){
 let s=0,n=0;const created=kidS(k).created||end;
 for(let i=0;i<7;i++){const d=addDays(end,-i);if(d<created)break;const L=peekDay(k,d);s+=d===TODAY()?pctOf(todayTasks(k)):(L&&L.sum&&L.sum.t?L.sum.d/L.sum.t*100:0);n++}
 return n?Math.round(s/n):0;
}
const weekKey=(d=TODAY())=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-x.getDay());return dk(x)};
function rewardInfo(k){const pl=plan(k),rw=RW(),wk=weekKey(),auto=weekPct(k),ovA=(rw.pct||{})[k]||{},ov=ovA[wk]!=null?ovA[wk]:pl.rewardPct[wk];const pct=ov!=null&&ov!==''?+ov:auto;return{wk,auto,pct,ov,amt:Math.round((+S().rewardBase||0)*pct/100),paid:((rw.paid||{})[k]||{})[wk]||pl.paid[wk]}}
function funState(k){
 const st=S(),n=nowMin(),a=toMin(st.playStart),b=toMin(st.playEnd);
 const ts=todayTasks(k),due=ts.filter(t=>isDue(t)&&t.sec!=='fun'&&!t.bonus),pend=due.filter(t=>!t.done);
 const pr=due.filter(t=>t.kind==='pr'&&!t.done);
 const pct=due.length?Math.round((due.length-pend.length)/due.length*100):100;
 const ok=pct>=(+st.playThreshold||0)&&pr.length===0;
 return{inWin:n>=a&&n<b,before:n<a,after:n>=b,ok,pct,pend,pr,a,b,n};
}
function remainBySec(k){const r={};for(const t of todayTasks(k))if(!t.done)r[t.sec]=(r[t.sec]||0)+1;const f=funState(k);r.fun=f.ok?0:Math.max(1,f.pend.length);return r}

async function say(text,language='ar'){text=String(text).replace(/[*#]/g,'').slice(0,1900);

 if(A.i<0)return head+`<div class="card"><h2>قبل أن نبدأ</h2>${dictObj?'':'<p class="ai">للإجابة بالصوت: اضغط داخل مربع الإجابة، ثم زر الميكروفون في لوحة مفاتيح جوالك وتحدّث، وستُكتب إجابتك تلقائيًا.</p>'}<p>اجلس في مكان هادئ. سأقرأ عليك كل سؤال، ثم اضغط زر الميكروفون وأجب بصوتك بكل صراحة — لا توجد إجابات خاطئة في أسئلة الشخصية. يمكنك الكتابة بدل الصوت إن أردت.</p><button class="btn acc" data-a="asStart" style="margin-top:12px">${ic('mic')} ابدأ</button></div></div>`;

 }
 return head+`<div class="card"><div class="stepbar">${Q.map((_,i)=>`<i class="${i<=A.i?'on':''}"></i>`).join('')}</div><p class="mut">السؤال ${A.i+1} من ${Q.length}</p>

 <div class="row" style="margin-top:12px">${A.i>0?'<button class="btn" data-a="asPrev">السابق</button>':''}<button class="btn pri" data-a="asNext">${A.i===Q.length-1?'إنهاء':'التالي'}</button><button class="btn ghost" data-a="asSkip">تخطي</button></div></div></div>`;

// ================= اعتماد الوالدين =================
const NOVER=['mentor','fun','rewards'];
const needsVer=sec=>!NOVER.includes(sec)&&!(S().verifyOff||[]).includes(sec);
const verOf=(k,d,id)=>((peekDay(k,d)||{}).ver||{})[id];
function verAuto(k,id,date=TODAY()){const L=dayLog(k,date);L.ver||={};if(PM())L.ver[id]={s:'ok',by:me,at:stamp(),auto:1};else{delete L.ver[id];const t=todayTasks(k,date).find(x=>x.id===id);if(t&&needsVer(t.sec)&&id!=='mentor:checkin')notifyParents(k,t.label.replace(/^(واجب|درس [^:]*): /,''))}}
function markVer(k,d,id,s,extra){const L=dayLog(k,d);L.ver||={};L.ver[id]=Object.assign({s,by:me,at:stamp()},extra||{});touchLog(k,d)}
function verTag(k,t,date=TODAY()){
 if(!needsVer(t.sec)||t.kind==='mission'||t.id==='mentor:checkin')return'';const v=verOf(k,date,t.id);
 if(t.done){if(!v)return' <span class="tag mid">بانتظار تأكيد والدك</span>';if(v.s==='ok'&&!v.auto)return' <span class="tag good">أكّده '+esc(M(v.by)?.name||'والدك')+(v.score!=null?' · '+v.score+'%':'')+'</span>';return''}
 return v&&v.s==='no'?' <span class="tag bad">لم يؤكده والدك</span>':'';
}
function doneAt(k,d,t){const L=peekDay(k,d)||{},ks=kidS(k);
 if(t.kind==='pr')return(L.pr||{})[t.id.slice(2)]?.at;if(t.kind==='az')return(L.az||{})[t.id.slice(2)]?.at;
 if(t.kind==='once')return ks.onceDone[t.id];if(t.kind==='hw')return ks.homework.find(h=>h.id===t.ref)?.doneAt;if(t.kind==='ls')return ks.lessonsDone[t.ref];
 return(L.done||{})[t.id]}
function pendingFor(k){const out=[],created=kidS(k).created||'0';
 for(let i=0;i<3;i++){const d=addDays(TODAY(),-i);if(d<created)break;if(!peekDay(k,d))continue;
  for(const t of todayTasks(k,d)){if(!t.done||t.kind==='mission'||t.id==='mentor:checkin'||!needsVer(t.sec))continue;if(verOf(k,d,t.id))continue;out.push({k,d,t})}}
 return out}
const pendingQuran=k=>kidS(k).quran.log.map((l,i)=>({l,i})).filter(x=>x.l.st==='pending');
const prPts=st=>{const b=+S().pts||10;return st==='ontime'?b:st==='late'?Math.round(b/2):Math.round(b/4)};
function rejectTask(k,d,t){const L=dayLog(k,d),ks=kidS(k),b=+S().pts||10;let pts=t.pts;
 if(t.kind==='once')delete ks.onceDone[t.id];
 else if(t.kind==='hw'){const h=ks.homework.find(x=>x.id===t.ref);if(h){h.done=false;h.doneAt=null}}
 else if(t.kind==='ls')delete ks.lessonsDone[t.ref];
 else if(t.kind==='pr'){const p=t.id.slice(2);pts=prPts(L.pr[p]?.st);delete L.pr[p]}
 else if(t.kind==='az'){const x=t.id.slice(2);pts=L.az[x]?.st==='self'?Math.round(b/2):b;delete L.az[x]}
 else if(t.kind==='water')L.water=0;
 else delete L.done[t.id];
 addPts(k,-pts);dropEv(k,d,t.id);markVer(k,d,t.id,'no');sumUp(k,d);touchKid(k)}
function dropEv(k,d,id){const L=dayLog(k,d);if(L.ev&&L.ev[id]){dropAudio(L.ev[id]);delete L.ev[id];touchLog(k,d)}}
const findT=(k,d,id)=>todayTasks(k,d).find(t=>t.id===id);
A.vOk=el=>{const{k,d,id}=el.dataset;markVer(k,d,id,'ok');dropEv(k,d,id);toast('تم التأكيد')};
A.vNo=el=>{const{k,d,id}=el.dataset,t=findT(k,d,id);if(t){rejectTask(k,d,t);toast('سُجّل أنه لم يُنجز، وخُصمت نقاطه')}};
A.vPr=el=>{const{k,d,id,st}=el.dataset,t=findT(k,d,id);if(!t)return;if(st==='none'){rejectTask(k,d,t);return}
 const L=dayLog(k,d),p=id.slice(2),r=L.pr[p];if(r&&r.st!==st){addPts(k,prPts(st)-prPts(r.st));r.st=st}markVer(k,d,id,'ok',{fix:r&&r.st});toast('تم')};
A.vAll=el=>{const k=el.dataset.k;for(const x of pendingFor(k)){markVer(k,x.d,x.t.id,'ok');dropEv(k,x.d,x.t.id)}toast('تم تأكيد الكل')};
A.vQ=el=>{const k=el.dataset.k,q=kidS(k).quran,l=q.log[+el.dataset.i];if(!l)return;
 if(el.dataset.ok==='1'){l.st='ok';const p=quranPortion(k);if(!l.surah||(l.surah===q.surah&&l.from===p.from))quranAdvance(k);markAuto(k,'q:hifz',2*(+S().pts||10));toast('اعتُمد التسميع')}
 else{l.st='retry';toast('طُلب منه إعادة التسميع')}
 if(l.audio){dropAudio(l.audio);l.audio=null}l.by=me;touchKid(k)};
const dayName=d=>d===TODAY()?'اليوم':d===addDays(TODAY(),-1)?'أمس':d.slice(5).replace('-','/');
function approvalsCard(){

 if(!groups.length)return`<div class="card"><div class="row sp"><h2>الاعتمادات</h2><span class="tag good">لا شيء بانتظارك</span></div></div>`;
 const n=groups.reduce((a,g)=>a+g.items.length+g.q.length,0);
 return `<div class="card" style="border-color:var(--sa)"><h2>بانتظار تأكيدك (${n})</h2><p class="mut">ما سجّله الأبناء خلال آخر 3 أيام. أكّد، أو صحّح، أو انفِ — والرفض يلغي المهمة ويخصم نقاطها.</p>
 ${groups.map(g=>`<div style="margin-top:12px"><div class="row sp"><h3 style="color:${g.m.color}">${esc(g.m.name)}</h3>${g.items.length>1?`<button class="btn sm" data-a="vAll" data-k="${g.m.id}">تأكيد الكل (${g.items.length})</button>`:''}</div>
 <ul class="list">${g.q.map(x=>`<li class="apv"><span class="grow"><b>تسميع: ${esc(x.l.what)}</b><br><span class="mut">${esc(x.l.at)}</span></span>${x.l.audio?`<button class="btn sm" data-a="play" data-src="q" data-k="${g.m.id}" data-i="${x.i}">${ic('speak')} استمع</button>`:''}<span class="row" style="gap:6px;flex-basis:100%"><input id="qs_${g.m.id}_${x.i}" type="number" min="0" max="100" inputmode="numeric" placeholder="الدرجة من 100" style="width:130px;flex:none"><input id="qn_${g.m.id}_${x.i}" placeholder="ملاحظة له (اختياري)" style="flex:1;min-width:140px"><button class="btn sm pri" data-a="vQScore" data-k="${g.m.id}" data-i="${x.i}">اعتماد الدرجة</button></span></li>`).join('')}
 ${g.items.map(({d,t})=>{const L=peekDay(g.m.id,d)||{},ev=(L.ev||{})[t.id],at=(doneAt(g.m.id,d,t)||'').slice(11),a=`data-k="${g.m.id}" data-d="${d}" data-id="${t.id}"`;

  return `<li class="apv"><span class="grow"><b>${esc(t.label)}</b><br><span class="mut">${dayName(d)}${at?' · سجّلها '+at:''}${pr?' · قال: '+({ontime:'في وقتها',late:'متأخرة',qada:'قضاء'}[pr.st]):''}${t.kind==='az'&&L.az[t.id.slice(2)]?.st==='self'?' · بدون تسجيل صوتي':''}</span></span>
  ${ev?`<button class="btn sm" data-a="play" data-src="ev" ${a}>${ic('speak')} استمع</button>`:''}
  ${t.kind==='pr'?`<span class="row" style="gap:4px"><button class="btn sm pri" data-a="vPr" ${a} data-st="ontime">في وقتها</button><button class="btn sm" data-a="vPr" ${a} data-st="late">متأخرة</button><button class="btn sm" data-a="vPr" ${a} data-st="qada">قضاء</button><button class="btn sm dang" data-a="vPr" ${a} data-st="none">لم يصلِّ</button></span>`
  :ev?`<span class="row" style="gap:6px"><input id="es_${g.m.id}_${d}_${t.id.replace(/[^a-z0-9]/gi,'')}" type="number" min="0" max="100" inputmode="numeric" placeholder="جودة القراءة /100" style="width:150px;flex:none"><button class="btn sm pri" data-a="vEvScore" ${a}>اعتماد</button><button class="btn sm dang" data-a="vNo" ${a}>لم يفعل</button></span>`:`<button class="btn sm pri" data-a="vOk" ${a}>${ic('check')} صحيح</button><button class="btn sm dang" data-a="vNo" ${a}>لم يفعل</button>`}</li>`}).join('')}</ul></div>`).join('')}</div>`;
}

const recInput=(key,label='سجّل بصوتك')=>`<div><button type="button" class="btn acc recbtn" data-a="recToggle" data-key="${key}" style="min-height:60px;font-size:18px;gap:10px">${ic('mic')} <span class="rl">${label}</span> <span class="rt num"></span></button><input type="file" accept="audio/*" capture data-rec="${key}" style="display:none"></div><div id="rp_${key}"></div>`;

async function saveAudio(blob){
 if(assetsObj){try{const r=await assetsObj.upload(blob);return{a:'as',id:r.id,url:r.url}}catch(e){}}
 if(!db)throw{m:'لا يمكن حفظ الصوت هنا'};if(blob.size>1500000)throw{m:'التسجيل طويل جدًا، اجعله أقصر من دقيقتين'};
 const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(blob)});
 const id=rid(),CH=180000,n=Math.ceil(b64.length/CH);for(let i=0;i<n;i++)await db.doc('audio/'+id+'_'+i).set({d:b64.slice(i*CH,(i+1)*CH)});

  ${st.members.map(m=>`<button class="btn" style="justify-content:flex-start;min-height:72px;background:var(--card)" data-a="joinPick" data-id="${esc(m.member_id)}"><span class="rank" style="background:${esc(m.color||'#0d5345')};color:#fff">${esc((m.name||'؟')[0])}</span><span><b>${esc(m.name)}</b><br><span class="mut">${{father:'الأب',mother:'الأم',child:'ابن / ابنة'}[m.role]}${m.has_secret?'':' · لم يُحدَّد رمز'}</span></span></button>`).join('')}</div>
  <button class="btn ghost" style="margin-top:14px" data-a="joinBack">${ic('back')} رمز عائلة آخر</button></div>`;
 return topLite()+`<section class="hero"><div class="in"><div><h1>أهلًا بك في نماء</h1><p>متابعة نمو الأبناء يومًا بيوم: الدراسة، الشخصية، اللغات، القرآن، الصلاة، المال، الوقت، الترفيه والمكافآت.</p></div></div></section>
 <div class="wrap"><form class="card" data-f="joinCode" style="margin-top:-40px"><h2>الدخول إلى عائلتك</h2><label>رمز العائلة</label><input name="c" required dir="ltr" placeholder="NAMAA-123456" value="${esc(last)}" autocapitalize="characters" style="font-size:20px;letter-spacing:1px"><button class="btn pri" style="margin-top:12px;width:100%">متابعة</button>${st.err?`<p style="color:var(--co)">${esc(st.err)}</p>`:''}</form>
 <div class="card"><h2>أنا الأب: أريد إنشاء عائلة جديدة</h2><p class="mut">مرة واحدة فقط. ستحصل على رمز العائلة لتسجيل دخول الأم والأبناء.</p><button class="btn acc" data-a="newFamily" style="margin-top:8px">${ic('plus')} إنشاء عائلة</button></div></div>`;
}
F.joinCode=async(f,d)=>{T.join={busy:1};try{await ensureSession();const r=await sb.rpc('family_members',{p_code:d.c});if(r.error)throw r.error;
 if(!r.data||!r.data.length){T.join={err:'رمز العائلة غير صحيح'};render(true);return}
 T.join={step:'members',code:d.c.trim().toUpperCase(),members:r.data,fname:''};render(true)}catch(e){T.join={err:online()?'تعذّر الاتصال بالخادم':'لا يوجد اتصال بالإنترنت'};render(true)}};
A.joinBack=()=>{T.join={};render(true)};
A.joinPick=el=>{const m=T.join.members.find(x=>x.member_id===el.dataset.id);const parent=m.role!=='child';
 modal(`<form data-f="joinSecret" data-id="${esc(m.member_id)}"><h2>${esc(m.name)}</h2><label>${parent?'كلمة المرور':'رمزك السري'}</label><input name="p" type="password" ${parent?'':'inputmode="numeric"'} autocomplete="current-password" required style="font-size:22px;letter-spacing:4px;text-align:center"><div class="row" style="margin-top:12px"><button class="btn pri">دخول</button><button type="button" class="btn" data-a="close">إلغاء</button></div><p id="jerr" style="color:var(--co)"></p></form>`);
 setTimeout(()=>{const i=$('.modal input');i&&i.focus()},50)};
F.joinSecret=async(f,d)=>{const e=$('#jerr');try{await ensureSession();
 const r=await sb.rpc('join_family',{p_code:T.join.code,p_member_id:f.dataset.id,p_secret:d.p,p_label:deviceLabel()});
 if(r.error)throw r.error;const j=r.data||{};if(!j.ok){if(e)e.textContent=errAr(j.error)+(j.left!=null&&j.left>=0?` (متبقٍ ${j.left} محاولات)`:'');return}
 C={};dirty={};setDev(j);closeModal();T.join=null;await afterLogin();go({n:'home'});toast('أهلًا '+(M(me)?.name||''))}
 catch(x){if(e)e.textContent=errAr(rpcErr(x))}};
const deviceLabel=()=>{const u=navigator.userAgent;return(/iPhone/.test(u)?'آيفون':/iPad/.test(u)?'آيباد':/Android/.test(u)?'أندرويد':/Windows/.test(u)?'ويندوز':/Mac/.test(u)?'ماك':'جهاز')+' · '+new Date().toLocaleDateString('ar-SA-u-nu-latn')};
A.newFamily=()=>{T.newFam=true;render(true)};

// تسجيل خروج هذا الجهاز
async function deviceLogout(){try{if(sb&&online())await sb.rpc('leave_device')}catch(e){}
 try{const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();const s=reg&&await reg.pushManager.getSubscription();if(s)await s.unsubscribe()}catch(e){}
 try{localStorage.removeItem('namaa-push')}catch(e){}
 if(rtChan){try{sb.removeChannel(rtChan)}catch(e){}rtChan=null}
 C={};dirty={};for(const k of Object.keys(REM))delete REM[k];remLoaded=false;setDev(null);saveLocal();T={};go({n:'home'})}

// بعد الدخول/الإنشاء
async function afterLogin(){db=makeDB();startRealtime();try{await loadAll()}catch(e){}cfgSeen=true;ensureSubs();flush();queueRender()}

// ---------- إدارة الأجهزة والاستيراد (للأب) ----------
A.devList=async()=>{try{const r=await sb.rpc('list_devices');if(r.error)throw r.error;T.devs=r.data||[];render(true)}catch(e){toast('تعذّر جلب الأجهزة')}};
A.devRevoke=el=>ask('سحب الدخول من هذا الجهاز؟',async()=>{const r=await sb.rpc('revoke_device',{p_user_id:el.dataset.id});if(r.error)toast('تعذّر');else{toast('سُحب الدخول');A.devList()}});
A.showCode=()=>modal(`<h2>رمز العائلة</h2><p class="big-n" dir="ltr" style="text-align:center;margin:14px 0">${esc(myDev.code)}</p><p>على جهاز كل فرد: افتح الموقع ← أدخل هذا الرمز ← اختر الاسم ← أدخل الرمز السري. يبقى الجهاز مسجّلًا بعدها.</p><div class="row" style="margin-top:12px"><button class="btn pri" data-a="copyCode">نسخ الرمز</button><button class="btn" data-a="close">إغلاق</button></div>`);
A.copyCode=()=>{try{navigator.clipboard.writeText(myDev.code);toast('نُسخ الرمز')}catch(e){toast(myDev.code)}};
// ---------- استيراد بيانات نماء السابق ----------
function parseImport(txt){const j=JSON.parse(String(txt).trim());const docs=j.docs||j;if(!docs||typeof docs!=='object'||!docs['fam/config'])throw 0;return docs}
async function importDocs(docs){
 const cfgD=docs['fam/config'];const pins={};
 for(const m of cfgD.members||[]){if(m.pin)pins[m.id]=String(m.pin);delete m.pin}
 if(cfgD.settings)cfgD.settings.parentPin='';
 for(const[p,v]of Object.entries(docs)){if(!/^(fam|plans|kids|logs)\//.test(p)||!v||typeof v!=='object')continue;
  if(p.startsWith('logs/'))for(const d of Object.values(v.days||{}))if(d&&d.ev)for(const k of Object.keys(d.ev))if(d.ev[k]&&d.ev[k].a==='db')delete d.ev[k];
  if(p.startsWith('kids/')&&v.quran&&v.quran.log)for(const l of v.quran.log)if(l.audio&&l.audio.a==='db')l.audio=null;
  C[p]=v;dirty[p]=++rev}
 saveLocal();ensureSubs();await flush();
 let noPin=[];
 for(const m of cfgD.members||[]){
  if(m.role==='father'){await sb.rpc('set_member',{p_member_id:'father',p_name:m.name,p_role:'father',p_color:null,p_secret:null});continue}
  const sec=pins[m.id]&&pins[m.id].length>=4?pins[m.id]:null;if(!sec)noPin.push(m.name);
  const r=await sb.rpc('set_member',{p_member_id:m.id,p_name:m.name,p_role:m.role,p_color:m.color||null,p_secret:sec});if(r.error)throw r.error}
 return noPin}
F.setupImport=async(f,d)=>{let docs;try{docs=parseImport(d.imp)}catch(e){toast('البيانات الملصقة غير صالحة — انسخها من زر «تصدير كل البيانات» في نماء السابق');return}
 const btn=f.querySelector('button.pri');if(btn){btn.disabled=true;btn.textContent='جارٍ النقل…'}
 try{await ensureSession();const fname=(docs['fam/config'].members||[]).find(m=>m.role==='father');const nm=d.fn.trim()||fname&&fname.name||'الأب';
  if(!myDev){const r=await sb.rpc('create_family',{p_family_name:'عائلة '+nm,p_father_name:nm,p_password:d.pw});if(r.error)throw r.error;
   const row=r.data[0];setDev({family_id:row.family_id,member_id:'father',role:'father',code:row.code,family_name:'عائلة '+nm});db=makeDB();startRealtime();remLoaded=true;cfgSeen=true}
  const fm=(docs['fam/config'].members||[]).find(m=>m.role==='father');if(fm)fm.name=nm;
  const noPin=await importDocs(docs);T.newFam=false;go({n:'home'});A.showCode();
  toast(noPin.length?`نُقلت البيانات. حدّد رمزًا سريًا لـ: ${noPin.join('، ')}`:'نُقلت كل البيانات، والأبناء يدخلون برموزهم السابقة نفسها')}
 catch(e){toast(errAr(rpcErr(e)));if(btn){btn.disabled=false;btn.textContent='إنشاء العائلة ونقل البيانات'}}};
document.addEventListener('change',async e=>{const i=e.target;if(!i.files||!i.files[0])return;
 if(i.id==='impFileSetup'){const ta=document.querySelector('textarea[name=imp]');if(ta)ta.value=await i.files[0].text();return}
 if(i.id!=='importFile')return;
 try{const docs=parseImport(await i.files[0].text());const noPin=await importDocs(docs);toast(noPin.length?`استُوردت البيانات. حدّد رمزًا لـ: ${noPin.join('، ')}`:'استُوردت كل البيانات');render(true)}
 catch(x){toast('ملف غير صالح')}});

// ---------- إعدادات إضافية + تقييم حضوري ----------
const _setP=F.settings;
F.settings=(f,d)=>{const st=S();const q=Math.round(num(d.qp));st.quranPass=q>0&&q<=100?q:80;_setP(f,d);
 if(d.fpw){if(d.fpw.length<6){toast('كلمة المرور 6 أحرف على الأقل');return}
  sb.rpc('set_member',{p_member_id:'father',p_name:(M('father')||{}).name||'الأب',p_role:'father',p_color:null,p_secret:d.fpw}).then(r=>toast(r.error?errAr(rpcErr(r.error)):'تم تغيير كلمة مرور الأب'))}};
A.qApprove=el=>{const k=el.dataset.k,p=quranPortion(k);
 modal(`<form data-f="qLive" data-k="${k}"><h2>تقييم حضوري</h2><p>سورة ${p.s.n}: ${p.from}–${p.to}</p><label>الدرجة من 100 (النجاح ${S().quranPass||80})</label><input name="s" type="number" min="0" max="100" required inputmode="numeric" style="font-size:22px"><label>ملاحظة (اختياري)</label><input name="n"><div class="row" style="margin-top:12px"><button class="btn pri">اعتماد</button><button type="button" class="btn" data-a="close">إلغاء</button></div></form>`)};
F.qLive=(f,d)=>{const k=f.dataset.k,q=kidS(k).quran,p=quranPortion(k),sc=clamp(Math.round(num(d.s)),0,100),pass=sc>=(+S().quranPass||80);
 q.log.push({at:stamp(),what:`سورة ${p.s.n} ${p.from}–${p.to} (حضوري)`,surah:q.surah,from:p.from,st:pass?'ok':'retry',score:sc,note:d.n||'',by:me});
 if(pass){quranAdvance(k);markAuto(k,'q:hifz',Math.max(1,Math.round(2*(+S().pts||10)*sc/100)))}touchKid(k);closeModal();toast(pass?'اعتُمد التسميع':'يحتاج إعادة')};
// ================= التشغيل =================
loadLocal();loadDevLocal();sbInit();
if(myDev&&sb){db=makeDB();cfgSeen=!!cfg()}
render(true);
(async()=>{
 initCaps();
 if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
 if(!sb){queueRender();return}
 if(myDev){
  startRealtime();
  try{await ensureSession();const r=await sb.rpc('my_device');
   if(!r.error){const d=(r.data||[])[0];if(!d){toast('سُحب الدخول من هذا الجهاز');await deviceLogout();return}setDev(d)}}catch(e){}
  try{await loadAll()}catch(e){}
  cfgSeen=true;ensureSubs();flush();
 }else{try{await ensureSession()}catch(e){}}
 queueRender();
 const expire=()=>{const m=ME();if(!m||m.role!=='child')return;const ks=kidS(m.id);let ch=false;for(const x of ks.mentor.missions)if(x.status==='active'&&addDays(x.start,(+x.days||1)-1)<TODAY()){x.status='expired';ch=true}if(ch)touchKid(m.id)};setTimeout(expire,4000);
 const autoLoc=()=>{const m=ME();if(m&&m.role==='child'){const l=kidS(m.id).loc;if(!l||l.src!=='paste')tryGPS(m.id,{silent:true})}};setTimeout(autoLoc,3000);setInterval(autoLoc,30*60000);
})();
}
